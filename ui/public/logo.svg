<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Volkai">
  <title>Volkai</title>
  <defs>
    <linearGradient id="vk-g" x1="6" y1="3" x2="58" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#34f5a2"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="vk-bg" cx="32" cy="30" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0a1226" stop-opacity=".0"/>
    </radialGradient>
    <filter id="vk-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- hexagon frame -->
  <path d="M32 2.5 57.5 17.25v29.5L32 61.5 6.5 46.75v-29.5z" fill="#070d1d" stroke="url(#vk-g)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 2.5 57.5 17.25v29.5L32 61.5 6.5 46.75v-29.5z" fill="url(#vk-bg)"/>
  <!-- circuit ticks on the frame -->
  <path d="M6.5 24h5M52.5 40h5M32 2.5v5M32 56.5v5" stroke="url(#vk-g)" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
  <g filter="url(#vk-glow)" stroke="url(#vk-g)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- charging station: body, display strip and base -->
    <rect x="16" y="15" width="21" height="31" rx="4.5" fill="#0b1630"/>
    <path d="M20.5 20h12" opacity=".7"/>
    <path d="M13 50h27"/>
    <!-- the cable leaves the station and curves into the plug -->
    <path d="M37 29c6.5 0 9 2.4 9 6.8V40"/>
    <!-- the plug -->
    <rect x="42" y="40" width="8" height="7.5" rx="2.2" fill="#0b1630"/>
    <path d="M44.2 47.5v3.2M47.8 47.5v3.2"/>
  </g>
  <!-- lightning bolt: the charge -->
  <path d="M29 22 21.2 34.5h5.6L24.6 44l9-12.4H28L29 22z" fill="url(#vk-g)" filter="url(#vk-glow)">
    <animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- status light -->
  <circle cx="33" cy="20" r="1.3" fill="#34f5a2"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>
